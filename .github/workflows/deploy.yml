name: Deploy to GitHub Pages

# The app is a static Vite bundle, so Pages serves it directly.
#
# It now reads the live database, so the build needs the project URL and the
# publishable (anon) key. Both come from repository secrets — Settings → Secrets
# and variables → Actions — never from a committed file:
#
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#
# Vite inlines them into the bundle, which is what the anon key is for. That is
# safe only because row level security is on and the anon role reads nothing;
# `npm run check:supabase` asserts exactly that. The service_role key must never
# be added here — it bypasses RLS.
#
# With the secrets unset the site still builds and deploys; it simply shows the
# sign-in screen saying it has not been configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # Catches a fixture that no longer satisfies the database constraints
      # before it reaches the deployed bundle.
      - name: Check the fixture against the schema
        run: node supabase/scripts/check-seed.mjs

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Pages has no SPA rewrite. Serving the same shell as 404 lets a deep link
      # such as /class/cls-5 boot the app, which then reads the URL itself.
      - name: SPA fallback
        run: cp app/dist/index.html app/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
